default: &default
  adapter: postgresql
  encoding: unicode
  max_connections: <%= ENV.fetch("RAILS_MAX_THREADS") { 5 } %>
  host: <%= ENV.fetch("DB_HOST", ENV.fetch("PGHOST", "localhost")) %>
  port: <%= ENV.fetch("DB_PORT", ENV.fetch("PGPORT", 5432)) %>
  username: <%= ENV.fetch("DB_USERNAME", ENV.fetch("PGUSER", ENV.fetch("USER", "postgres"))) %>
  password: <%= ENV.fetch("DB_PASSWORD", ENV["PGPASSWORD"]) %>

development:
  <<: *default
  database: <%= ENV.fetch("DB_NAME", "codeblue7_development") %>

test:
  <<: *default
  database: <%= ENV.fetch("TEST_DB_NAME", "codeblue7_test") %>

production:
  primary:
    <<: *default
    database: <%= ENV.fetch("DB_NAME", "codeblue7_production") %>
  cache:
    <<: *default
    database: <%= ENV.fetch("CACHE_DB_NAME", "codeblue7_production_cache") %>
    migrations_paths: db/cache_migrate
  queue:
    <<: *default
    database: <%= ENV.fetch("QUEUE_DB_NAME", "codeblue7_production_queue") %>
    migrations_paths: db/queue_migrate
  cable:
    <<: *default
    database: <%= ENV.fetch("CABLE_DB_NAME", "codeblue7_production_cable") %>
    migrations_paths: db/cable_migrate
